# Render Blueprint for the API (backend/). The storefront (frontend/) is on Vercel.
# Apply once: Render dashboard > New > Blueprint > this repo. Values marked
# `sync: false` are entered in the dashboard and never live in git.
# Optional features are switched on later under Environment, same names as
# backend/.env.example: GMAIL_USER, GMAIL_APP_PASSWORD, OWNER_EMAIL,
# WHATSAPP_NUMBER, PAYSTACK_SECRET_KEY, CLOUDINARY_URL.
#
# Moving from the Python service: baseline the live database first (backend/README.md,
# "Moving from Alembic"), or the first start stops at `prisma migrate deploy`.
services:
  - type: web
    name: decar-revolutionist-api
    runtime: node
    plan: free
    region: ohio # next to the database (us-east-2)
    rootDir: backend
    # Node from backend/.node-version; pnpm from package.json's packageManager.
    # `corepack enable` fails here (it would replace Render's read-only
    # /usr/bin/pnpm), so corepack runs pnpm directly. The start command skips
    # pnpm: corepack's download cache doesn't survive from build to run.
    buildCommand: COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm install --frozen-lockfile && corepack pnpm build
    startCommand: ./node_modules/.bin/prisma migrate deploy && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_URL
        value: https://decar-revolutionist.vercel.app
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      # The database's direct (non-pooled) URI, for prisma migrate deploy. Needed
      # when DATABASE_URL is a transaction-mode pooler (Neon's -pooler host,
      # Supabase's port 6543); leave it unset otherwise.
      - key: DIRECT_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_MOBILE_CLIENT_IDS
        sync: false
      - key: ADMIN_EMAILS
        sync: false
